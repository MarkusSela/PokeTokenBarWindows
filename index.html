function pokedex(){const map=new Map();const filter=dexRarityFilter;collectionEntries().forEach(x=>{if(filter!=='all'&&(x.rarity||'common')!==filter)return;x.chainOrder.forEach(id=>{const current=map.get(id);if(current){current.shiny=current.shiny||Boolean(x.shiny);current.isRaising=current.isRaising||Boolean(!x.caughtAt);}else map.set(id,{id,name:nameOf(x,id),shiny:Boolean(x.shiny),isRaising:Boolean(!x.caughtAt),rarity:x.rarity||'common'})})});if(!map.size)return `<div class="empty">📖<h2>${tr('pokedexEmpty')}</h2>${tr('discovered')}</div>`;const all=[...map.values()].sort((a,b)=>a.id-b.id),pages=Math.max(1,Math.ceil(all.length/24));dexPage=Math.min(dexPage,pages-1);const visible=all.slice(dexPage*24,dexPage*24+24);return `<div class="dex-grid">${visible.map(x=>`<div class="dex-cell"><img src="${sprite(x.id,x.shiny)}" alt="${x.name}"><b>#${x.id} ${x.name}${x.shiny?' ✨':''}</b><small>${x.isRaising?tr('inProgress'):x.rarity}</small><button class="pin-button" onclick="pinSpecies(${x.id})">${data.state.representativeSpeciesId===x.id?tr('unpin'):tr('pinToTray')}</button></div>`).join('')}</div>${pages>1?`<div class="row" style="margin-top:7px"><button type="button" onclick="dexPage=Math.max(0,dexPage-1);render()" ${dexPage===0?'disabled':''}>${tr('previous')}</button><small>${tr('page')} ${dexPage+1} / ${pages} · 24 ${tr('perPage')}</small><button type="button" onclick="dexPage=Math.min(${pages-1},dexPage+1);render()" ${dexPage===pages-1?'disabled':''}>${tr('next')}</button></div>`:''}`}
function elapsed(date){if(!date)return tr('inProgress');const hours=Math.max(0,Math.floor((Date.now()-new Date(date).getTime())/3600000));const days=Math.floor(hours/24);if(lang()==='it')return days?`${days} giorni, ${hours%24} ore`:`${hours} ore`;return days?`${days} days, ${hours%24} hr`:`${hours} hr`}
function catchLog(){const entries=catchLogEntries().filter(x=>logRarityFilter==='all'||(x.rarity||'common')===logRarityFilter);if(!entries.length)return `<div class="empty">📜<h2>${tr('catchLogEmpty')}</h2>${tr('captured')}</div>`;return entries.map(x=>{const id=x.chainOrder.at(-1);return `<section class="card catch-row" data-entry-id="${x.id}" data-entry-kind="${x.kind}"><div class="catch-sprites">${x.chainOrder.map((i,index)=>(index?'<span class="chain-arrow">›</span>':'')+`<span class="catch-stage"><img src="${sprite(i,x.shiny)}" alt="${nameOf(x,i)}"><small>${nameOf(x,i)}</small></span>`).join('')}</div><div class="catch-meta"><div class="catch-name-row"><b>${nameOf(x,id)}</b></div><small>${x.kind==='active'?tr('inProgress'):tr('captured')} · ${(x.rarity||'common').toUpperCase()}</small><small>${x.nature||''}${x.caughtAt?' · '+new Date(x.caughtAt).toLocaleString():''}</small></div></section>`}).join('')}
function collection(){return `${collectionMode==='dex'?pokedex():catchLog()}<div class="collection-footer">${collectionFilters()}<div class="collection-toggle"><button type="button" class="${collectionMode==='dex'?'primary':''}" onclick="collectionMode='dex';render()">Pokémon</button><button type="button" class="${collectionMode==='log'?'primary':''}" onclick="collectionMode='log';render()">${tr('catchLog')}</button></div></div>`}
function checkForUpdates(){updateStatus={pending:true};render();window.ptb.action('check-update').then(result=>{updateStatus=result.update||{ok:false};render()}).catch(()=>{updateStatus={ok:false};render()})}
function openExternal(url){return window.ptb.openExternal(url)}
function openUpdate(){if(updateStatus?.url)return openExternal(updateStatus.url)}
function settings(){
 const s=data.settings||{};
 const officialLimits=Boolean(data.limits?.officialAvailable&&data.limits?.windows?.length);const scanSummary=data.usage?.additionalScanRows?`<small>${data.usage.additionalScanRows} rows · ${data.usage.additionalScanUnattributedRows||0} ${data.settings?.language==='it'?'senza timestamp':'without timestamp'}</small>`:'';
 const select=(key,options,disabled=false)=>`<select ${disabled?'disabled':''} onchange="setSetting('${key}',this.value)">${options.map(([value,label])=>`<option value="${value}" ${String(s[key])===String(value)?'selected':''}>${label}</option>`).join('')}</select>`;
 const toggle=(key,disabled=false)=>`<button type="button" aria-label="Toggle ${key}" class="switch ${s[key]?'on':''}" ${disabled?'disabled':''} onclick="setSetting('${key}',${!s[key]})"></button>`;
 const range=(key,min,max,disabled=false)=>`<input type="range" min="${min}" max="${max}" value="${s[key]}" ${disabled?'disabled':''} oninput="updateRangeLive(this,'${key}')"><output data-setting-value="${key}">${s[key]}%</output>`;
 const languageOptions=[['en','English'],['it','Italiano'],['ko','한국어'],['ja','日本語'],['es','Español'],['fr','Français'],['pt','Português']];
 const refreshOptions=[['manual',tr('manual')],...Array.from({length:15},(_,i)=>[i+1,`${i+1} ${i===0?tr('minute'):tr('minutes')}`])];
 const updateLabel=updateStatus?.pending?tr('updateChecking'):!updateStatus?tr('checkForUpdates'):updateStatus.ok?(updateStatus.updateAvailable?`${tr('updateAvailable')}: ${updateStatus.latestVersion}`:(updateStatus.windowsReleaseAvailable?tr('upToDate'):tr('windowsReleaseUnavailable'))):tr('updateUnavailable');
 return `<section class="card"><div class="row"><h2>${tr('settings')}</h2><button type="button" class="settings-back" onclick="tab='home';render()">← ${tr('back')}</button></div><div class="settings-group">${tr('general')}</div><div class="setting"><span><b>${tr('language')}</b></span>${select('language',languageOptions)}</div><div class="setting"><span><b>${tr('refreshInterval')}</b><small>${tr('refreshHint')}</small></span>${select('refreshMinutes',refreshOptions)}</div><div class="setting"><span><b>${tr('limitDisplay')}</b></span>${select('limitDisplay',[['used',tr('used')],['remaining',tr('remaining')]],!officialLimits)}</div><div class="setting"><span><b>${tr('launchLogin')}</b></span>${toggle('launchAtLogin')}</div><div class="setting"><span><b>${tr('representative')}</b><small>${data.representative?.name||tr('followCurrent')}</small></span><button type="button" onclick="tab='collection';render()">${tr('chooseInPokedex')}</button></div><div class="settings-group">${tr('showMenu')}</div><div class="setting"><span><b>${tr('todayTokens')}</b></span>${toggle('menuTodayTokens')}</div><div class="setting"><span><b>${tr('todayCost')}</b></span>${toggle('menuTodayCost')}</div><div class="setting"><span><b>${tr('limitPercent')}</b></span>${toggle('menuLimitPercent',!officialLimits)}</div><div class="settings-group">${tr('floatingPet')}</div><div class="setting"><span><b>${tr('showFloating')}</b><small>${tr('floatingHint')}</small></span>${toggle('showFloatingPet')}</div>${s.showFloatingPet?`<div class="setting"><span><b>${tr('size')}</b></span><input type="range" min="48" max="256" value="${s.floatingPetSize}" oninput="updatePetSizeLive(this.value)"><output data-setting-value="floatingPetSize">${s.floatingPetSize}px</output></div>`:''}<div class="setting"><span><b>${tr('walkingGold')}</b><small>${tr('walkingGoldHint')}</small></span>${toggle('showGoldWalking')}</div>${s.showGoldWalking?`<div class="setting"><span><b>${tr('walkingGoldSize')}</b><small>${tr('walkingGoldSizeHint')}</small></span><span class="range-control"><input type="range" min="24" max="128" value="${s.goldWalkingSize}" oninput="updateRangeLive(this,'goldWalkingSize')"><output data-setting-value="goldWalkingSize">${s.goldWalkingSize}px</output></span></div>`:''}<div class="settings-group">${tr('notifications')}</div><div class="setting"><span><b>${tr('notificationsBubbles')}</b><small>${tr('notificationsBubblesHint')}</small></span>${toggle('notificationsBubbles')}</div><div class="setting"><span><b>${tr('limitAlerts')}</b></span>${toggle('limitAlerts',!officialLimits)}</div><div class="setting"><span><b>${tr('warning')}</b></span>${range('warningPercent',0,100,!officialLimits)}</div><div class="setting"><span><b>${tr('critical')}</b></span>${range('criticalPercent',0,100,!officialLimits)}</div><div class="setting"><span><b>${tr('companionEvents')}</b><small>${tr('companionHint')}</small></span>${toggle('companionEvents')}</div><div class="setting"><span><b>${tr('providerChecks')}</b></span>${toggle('providerStatus',!officialLimits)}</div><div class="settings-group">${tr('privacy')}</div><div class="setting"><span><b>${tr('keychain')}</b><small>${tr('keychainHint')}</small></span>${toggle('keychainOptOut')}</div><details class="settings-disclosure" data-settings-section="scan"${settingsSections.scan?' open':''} ontoggle="settingsSections.scan=this.open"><summary>${tr('advancedScan')}</summary><div class="disclosure-body"><div class="setting"><span><b>${tr('additionalFolders')}</b><small>${tr('scanHint')}</small>${scanSummary}</span><span><button type="button" onclick="chooseScanFolders()">${tr('add')}</button> <button type="button" onclick="clearScanFolders()">${tr('clear')}</button></span></div><div class="scan-paths">${(s.additionalScanFolders||[]).map(x=>`<small>${x}</small>`).join('')||`<small>${tr('noneConfigured')}</small>`}</div></div></details><details class="settings-disclosure" data-settings-section="backup"${settingsSections.backup?' open':''} ontoggle="settingsSections.backup=this.open"><summary>${tr('backup')}</summary><div class="disclosure-body"><div class="setting"><span><b>${tr('backupTitle')}</b><small>${tr('backupHint')}</small></span><span><button type="button" onclick="exportSave()">${tr('export')}</button> <button type="button" onclick="importSave()">${tr('import')}</button></span></div></details><details class="settings-disclosure" data-settings-section="updates"${settingsSections.updates?' open':''} ontoggle="settingsSections.updates=this.open"><summary>${tr('updates')}</summary><div class="disclosure-body"><div class="setting"><span><b>${tr('updateNotifications')}</b></span>${toggle('updateNotifications')}</div><div class="setting"><span><b>${tr('checkForUpdates')}</b><small>${updateLabel}</small></span><button type="button" onclick="checkForUpdates()" ${updateStatus?.pending?'disabled':''}>${tr('checkNow')}</button>${updateStatus?.updateAvailable?`<button type="button" onclick="openUpdate()">${tr('openRelease')}</button>`:''}</div></div></details><div class="settings-group">${tr('aboutSupport')}</div><div class="setting"><span><b>${tr('projectLink')}</b></span><button type="button" onclick="openExternal('https://github.com/MarkusSela/PokeTokenBarWindows-Lab')">GitHub</button></div><div class="setting"><span><b>${tr('reportIssue')}</b></span><button type="button" onclick="openExternal('https://github.com/MarkusSela/PokeTokenBarWindows-Lab/issues/new')">${tr('open')}</button></div></section>`
}

function refreshLabel(){if(!data?.lastRefreshAt)return tr('refreshNow');const minutes=Math.floor(Math.max(0,Date.now()-data.lastRefreshAt)/60000);return minutes?`${lang()==='it'?'Aggiornato':'Updated'} ${minutes} ${tr('minAgo')}`:tr('updatedJustNow')}
let liveSettingState={};
function updateSettingLive(key,value){const numeric=Number(value);if(!Number.isFinite(numeric))return;if(data?.settings)data.settings[key]=numeric;const output=el(`[data-setting-value="${key}"]`);if(output)output.textContent=`${numeric}${key==='floatingPetSize'||key==='goldWalkingSize'?'px':'%'}`;const state=liveSettingState[key]??={value:numeric,timer:null,lastSentAt:0};state.value=numeric;const send=()=>{state.timer=null;if(state.value===state.lastSent)return;state.lastSent=state.value;state.lastSentAt=performance.now();window.ptb.action('setting-live',{key,value:state.value}).catch(()=>{});if(state.value!==state.lastSent)state.timer=setTimeout(send,50)};if(!state.timer)state.timer=setTimeout(send,Math.max(0,50-(performance.now()-state.lastSentAt)))}
function updateRangeLive(input,key){updateSettingLive(key,input.value)}
function updatePetSizeLive(value){updateSettingLive('floatingPetSize',value)}
async function setSetting(key,value){data=await window.ptb.action('setting',{key,value});render()}async function chooseScanFolders(){data=await window.ptb.action('choose-scan-folders');render()}async function clearScanFolders(){data=await window.ptb.action('clear-scan-folders');render()}
async function manualRefresh(){const button=el('#updated');if(button)button.disabled=true;try{data=await window.ptb.action('refresh');render();showNotice(data?.error||tr('updatedJustNow'))}catch(error){showNotice(error?.message||tr('hermesError'))}finally{if(button)button.disabled=false}}
async function exportSave(){const result=await window.ptb.action('export-save');showNotice(result.ok?tr('exported'):tr('exportCancelled'))}
    async function importSave(){const result=await window.ptb.action('import-save');if(result.ok){data=result;render();showNotice(tr('imported'))}else if(result.error)showNotice(result.error)}
function showNotice(text){const notice=el('#notice');if(!notice)return;clearTimeout(noticeTimer);notice.textContent=text||'';notice.classList.toggle('visible',Boolean(text));schedulePopoverResize();if(text)noticeTimer=setTimeout(()=>{notice.textContent='';notice.classList.remove('visible');schedulePopoverResize()},3500)}
    function schedulePopoverResize(){cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{const view=el('#view'),page=el('.section-page'),top=el('.top-bar'),bottom=el('.bottom-bar');if(!view||!page||!top||!bottom)return;const contentHeight=Math.max(page.scrollHeight,page.offsetHeight);const required=Math.ceil(top.offsetHeight+contentHeight+bottom.offsetHeight+20);window.ptb.setPopoverContentHeight(required)})}
    function render(){const view=el('#view');if(view&&lastRenderedTab===tab)scrollPositions[tab]=view.scrollTop;document.body.dataset.tab=tab;document.body.dataset.rarity=data?.active?.rarity||'common';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));const content=data?.error?`<div class="empty">${tr('hermesError')}<br><small>${data.error}</small></div>`:tab==='home'?home():tab==='shop'?shop():tab==='bag'?bag():tab==='collection'?collection():settings();view.innerHTML=`<div class="section-page">${content}</div>`;view.scrollTop=lastRenderedTab===tab?(scrollPositions[tab]||0):0;lastRenderedTab=tab;const refresh=el('#updated');if(refresh){refresh.title=refreshLabel();refresh.setAttribute('aria-label',refreshLabel())}applyLocalization();bindProviderControls();schedulePopoverResize();syncEggAnimation()}

async function load(){data=await window.ptb.snapshot();render()}async function act(type,value){const candyAction=type==='candy';if(candyAction&&actionPending)return null;if(candyAction){actionPending=true;render()}try{data=await window.ptb.action(type,value);if((type==='mint'||type==='candy')&&data.ok){clearTimeout(mintSparkleTimer);mintSparkle=true;render();mintSparkleTimer=setTimeout(()=>{mintSparkle=false;render()},900)}else{render()}showNotice(data.ok?tr('completed'):tr('operationUnavailable'));return data}finally{if(candyAction){actionPending=false;render()}}}function openSettings(){tab='settings';render()}function resetHome(){tab='home';collectionMode='dex';dexPage=0;dexRarityFilter='all';logRarityFilter='all';if(el('#view'))el('#view').scrollTop=0;render()}function quitApp(){window.ptb.action('quit')}
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;render()});window.ptb.onPopoverResetHome(resetHome);window.ptb.onPopoverOpened(beginEggWindowSession);window.ptb.onSnapshot(next=>{data=next;render()});load();setInterval(()=>{const button=el('#updated');if(button){const label=refreshLabel();button.title=label;button.setAttribute('aria-label',label)}},60000);
</script>
